name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests (API Kodi simulée)
        run: python3 -m unittest discover -s tests -v
      - name: Archive installable
        run: ./build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: service.disc-launcher
          path: dist/*.zip
